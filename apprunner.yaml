# AWS App Runner config — only read if you connect App Runner directly to
# this GitHub repo (the "source code" deployment method) instead of building
# and pushing the Dockerfile to ECR yourself. If you use the Dockerfile
# instead, this file is ignored and the port/env vars below are configured
# directly in the App Runner service definition (console/CLI) instead.
#
# Secrets (DATABASE_URL, SESSION_SECRET, ENCRYPTION_KEY) are deliberately NOT
# listed here — set those as environment variables/secrets on the App Runner
# service itself, never committed to source control.
version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  runtime-version: 20
  command: npm start
  network:
    port: 5000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: DB_DRIVER
      value: pg
